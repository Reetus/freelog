name: Release

# Push a tag like v0.2.0 (or v0.2.0-beta.1) to publish:
#   - FreeLog.Logging to GitHub Packages (always) and nuget.org (when the NUGET_USER repo variable is set;
#     uses nuget.org Trusted Publishing, so no API key is stored: see README "Releases")
#   - the relay image to ghcr.io/<owner>/freelog-relay
#   - a GitHub release with the .nupkg attached
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.2.0-preview.1)"
        required: true

permissions:
  contents: write
  packages: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  nuget:
    name: NuGet package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # GitHub OIDC token for nuget.org Trusted Publishing
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: Resolve version
        run: |
          v="${{ github.event.inputs.version }}"
          [ -z "$v" ] && v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Publishing $v"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet test -c Release
      - run: dotnet pack src/FreeLog.Logging -c Release -o artifacts -p:Version=${{ steps.version.outputs.version }}

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate

      # nuget.org Trusted Publishing: exchanges the job's OIDC token for an API key valid for 1 hour.
      - name: nuget.org login
        id: nuget-login
        if: vars.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        if: vars.NUGET_USER != ''
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --skip-duplicate

      - uses: actions/upload-artifact@v7
        with:
          name: nuget
          path: artifacts/*

  relay-image:
    name: Relay container image
    runs-on: ubuntu-latest
    needs: nuget
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/freelog-relay
          tags: |
            type=raw,value=${{ needs.nuget.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(needs.nuget.outputs.version, '-') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: src/FreeLog.Relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [nuget, relay-image]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.nuget.outputs.version }}
          name: v${{ needs.nuget.outputs.version }}
          prerelease: ${{ contains(needs.nuget.outputs.version, '-') }}
          generate_release_notes: true
          files: artifacts/*
