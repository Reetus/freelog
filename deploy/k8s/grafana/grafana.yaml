# Optional: Grafana with the VictoriaLogs datasource and freelog dashboards pre-provisioned.
# Needs the Secret "freelog-grafana-admin" (key "password"); see ../README.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  labels: { app.kubernetes.io/name: grafana }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels: { app.kubernetes.io/name: grafana }
spec:
  selector: { app.kubernetes.io/name: grafana }
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: { app.kubernetes.io/name: grafana }
spec:
  replicas: 1
  strategy:
    type: Recreate   # single ReadWriteOnce volume
  selector:
    matchLabels: { app.kubernetes.io/name: grafana }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        freelog.service: grafana
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:12.4.14
          env:
            # Installed before Grafana starts serving, so the provisioned datasource works immediately.
            - name: GF_PLUGINS_PREINSTALL_SYNC
              value: victoriametrics-logs-datasource
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: freelog-grafana-admin, key: password }
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana-dashboards/freelog-overview.json
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana-dashboards
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: grafana-data }
        - name: datasources
          configMap: { name: freelog-grafana-datasources }
        - name: dashboard-provider
          configMap: { name: freelog-grafana-dashboard-provider }
        - name: dashboards
          configMap: { name: freelog-grafana-dashboards }
