apiVersion: v1
kind: Service
metadata:
  name: victorialogs
  labels: { app.kubernetes.io/name: victorialogs }
spec:
  selector: { app.kubernetes.io/name: victorialogs }
  ports:
    - name: http
      port: 9428
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victorialogs
  labels: { app.kubernetes.io/name: victorialogs }
spec:
  serviceName: victorialogs
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: victorialogs }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victorialogs
        freelog.collect: "false"   # don't ingest the log store's own logs
    spec:
      containers:
        - name: victorialogs
          image: victoriametrics/victoria-logs:v1.52.0
          args:
            - -storageDataPath=/vlogs
            - -httpListenAddr=:9428
            - -loggerFormat=json
            # Retention: logs older than this are deleted...
            - -retentionPeriod=14d
            # ...and the oldest data is also dropped once this much disk is used.
            - -retention.maxDiskSpaceUsageBytes=10GiB
          ports:
            - name: http
              containerPort: 9428
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /vlogs
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 12Gi
