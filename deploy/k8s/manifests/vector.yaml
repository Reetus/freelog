# Vector agent: one pod per node, tails /var/log/pods (what `kubectl logs` reads) with checkpoints.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: freelog-vector
rules:
  # kubernetes_logs enriches events with pod, namespace and node metadata.
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: freelog-vector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: freelog-vector
subjects:
  - kind: ServiceAccount
    name: vector
    namespace: freelog
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  labels: { app.kubernetes.io/name: vector }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: vector }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vector
        freelog.collect: "false"   # don't collect Vector's own logs
    spec:
      serviceAccountName: vector
      tolerations:
        - operator: Exists           # run on every node, including tainted ones
      containers:
        - name: vector
          image: timberio/vector:0.60.0-debian
          args: [--config, /etc/vector/vector-agent.yaml]
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: VECTOR_SELF_POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: VECTOR_SELF_POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: FREELOG_ENV
              value: production
            - name: VECTOR_WATCH_CONFIG
              value: "true"
            - name: VECTOR_LOG
              value: warn
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: config
              mountPath: /etc/vector
              readOnly: true
            - name: vrl
              mountPath: /vector-vrl
              readOnly: true
            - name: data
              mountPath: /vector-data-dir
            - name: var-log
              mountPath: /var/log
              readOnly: true
      volumes:
        - name: config
          configMap: { name: freelog-vector-config }
        - name: vrl
          configMap: { name: freelog-vector-vrl }
        - name: data
          hostPath: { path: /var/lib/freelog-vector, type: DirectoryOrCreate }   # file checkpoints
        - name: var-log
          hostPath: { path: /var/log }
